<div class="login-container">
  <img
    src="icons/icon-192x192.png"
    alt="Logo Ecomovi"
    class="mb-4"
    style="width: 140px"
  />

  <h1>Iniciar Sesión</h1>
  <p>Inicia sesión para poder usar la app</p>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="flex flex-column gap-3 mt-4 w-full"
  >
    <div class="p-float-label">
      <input
        id="email"
        type="email"
        pInputText
        formControlName="email"
        placeholder=" "
      />
      <label for="email">Correo Institucional</label>
    </div>

    <div class="p-float-label">
      <p-password
        inputId="password"
        formControlName="password"
        placeholder=" "
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      >
      </p-password>
      <label for="password">Contraseña</label>
    </div>

    <p-button
      label="Iniciar Sesión"
      type="submit"
      [loading]="form.disabled"
      styleClass="mt-2"
    >
    </p-button>
  </form>

  <p class="mt-4">
    ¿Aún no tienes una cuenta?
    <a routerLink="/auth/register">Regístrate</a>
  </p>
</div>
