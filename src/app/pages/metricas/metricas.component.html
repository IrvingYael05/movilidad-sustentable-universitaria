<div class="p-4">
  <h1 class="text-3xl font-bold text-center mb-6" style="color: var(--primary-color)">
    Dashboard Administrativo
  </h1>

  <div class="grid">
    <div class="col-12 md:col-4">
      <div class="card text-center">
        <h3 class="text-xl m-0 text-secondary">Ocupación Actual</h3>
        <p class="text-4xl font-bold m-2" [style.color]="ocupacionActual > 30 ? 'red' : 'green'">
          {{ ocupacionActual }} / 37
        </p>
        <small>Espacios ocupados en tiempo real</small>
      </div>
    </div>
    <div class="col-12 md:col-8">
      <div class="card flex align-items-center justify-content-center h-full">
        <span class="text-xl">Meta del mes: 1 Tonelada de CO2</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="text-xl font-bold mb-4">Impacto Ambiental y Tendencia</h2>
    <div style="height: 400px;"> <p-chart 
        type="line" 
        [data]="dataCO2" 
        [options]="optionsCO2" 
        height="100%">
      </p-chart>
    </div>
    <p class="mt-3 text-sm text-secondary text-center">
      * La línea punteada naranja representa la predicción lineal basada en el comportamiento histórico.
    </p>
  </div>
</div>
