<div class="flex flex-column align-items-center justify-content-center h-screen p-4">
  <img src="icons/icon-192x192.png" alt="Logo Ecomovi" class="mb-4" style="width: 140px;">

  <h1 class="text-3xl font-bold m-0">Iniciar Sesión</h1>
  <p class="text-secondary mt-1">Inicia sesión para poder usar la app</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3 mt-4 w-full md:w-25rem">
    <div class="p-float-label">
      <input id="email" type="email" pInputText class="w-full" formControlName="email" placeholder=" " />
      <label for="email">Correo</label>
    </div>

    <div class="p-float-label">
      <p-password
        inputId="password"
        formControlName="password"
        placeholder=" "
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-password>
      <label for="password">Contraseña</label>
    </div>

    <p-button
      label="Iniciar Sesión"
      type="submit"
      [loading]="loginForm.disabled"
      styleClass="w-full">
    </p-button>
  </form>

  <p class="mt-4">
    ¿Aún no tienes una cuenta? <a routerLink="register" class="font-bold no-underline">Regístrate</a>
  </p>
</div>
