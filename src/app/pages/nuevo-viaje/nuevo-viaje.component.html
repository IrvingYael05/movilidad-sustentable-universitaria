<div
    class="flex flex-column align-items-center justify-content-center min-h-screen p-4 surface-ground overflow-auto"
    >
    <div class="w-full md:w-30rem">
        <!-- Logo -->
        <div class="text-center mb-4">
        <h1 class="text-3xl font-bold m-0">Nuevo Viaje</h1>
        <p class="text-secondary mb-4 mt-2">
            Completa los campos para publicar tu viaje
        </p>
        </div>

        <!-- Formulario -->
        <div class="flex flex-column gap-3">
        <!-- Punto de partida -->
        <div class="section-header">
            <label class="font-semibold">Punto de partida</label>
        </div>

        <input
            pInputText
            placeholder="Calle del punto de partida"
            [(ngModel)]="viaje.calle"
            class="w-full"
        />

        <!-- Número exterior y Código Postal (en la misma línea) -->
        <div class="flex gap-2">
            <input
            pInputText
            placeholder="Número exterior"
            [(ngModel)]="viaje.numeroExterior"
            class="flex-1"
            />
            <input
            pInputText
            placeholder="Código Postal"
            [(ngModel)]="viaje.codigoPostal"
            class="flex-1"
            />
        </div>

        <input
            pInputText
            placeholder="Colonia del punto de partida"
            [(ngModel)]="viaje.colonia"
            class="w-full"
        />

        <!-- Hora -->
        <div class="section-header mt-2">
            <label class="font-semibold">Hora</label>
        </div>
        <p-inputMask
            [(ngModel)]="viaje.hora"
            mask="99:99"
            placeholder="00:00"
            styleClass="w-full"
        ></p-inputMask>

        <!-- Lugares disponibles -->
        <div class="section-header mt-2">
            <label class="font-semibold">Lugares disponibles</label>
        </div>
        <input
            pInputText
            type="number"
            placeholder="Número de pasajeros disponible"
            [(ngModel)]="viaje.lugaresDisponibles"
            class="w-full"
        />

        <!-- Pasajeros -->
        <div class="section-header mt-2">
            <label class="font-semibold">Pasajeros</label>
        </div>
        <div class="flex flex-column gap-2">
            <div
                *ngFor="let pasajero of pasajeros; let i = index"
                class="flex align-items-center justify-content-between pasajero-item"
            >
                <span>Pasajero {{ pasajero }}</span>
                <div class="flex gap-2">
                    <button
                        pButton
                        label="+"
                        class="p-button-rounded p-button-sm add-btn"
                        (click)="agregarPasajero()"
                        *ngIf="i === pasajeros.length - 1"
                    ></button>
                    <button
                        pButton
                        label="-"
                        class="p-button-rounded p-button-sm p-button-danger remove-btn"
                        (click)="eliminarPasajero(i)"
                        *ngIf="pasajeros.length > 1"
                    ></button>
                </div>
            </div>
        </div>

        <!-- Botón Publicar -->
        <div class="flex justify-content-end mt-4">
            <p-button
                label="Publicar Viaje"
                [loading]="isLoading"
                (click)="publicarViaje()"
                styleClass="publish-btn">
            </p-button>
        </div>
        </div>
    </div>
</div>

<!-- Mostrar mensajes -->
<p-toast position="top-right"></p-toast>
