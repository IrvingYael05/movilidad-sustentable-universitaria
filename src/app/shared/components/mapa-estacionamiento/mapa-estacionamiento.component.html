<p-toast position="top-right"></p-toast>

<div class="mapa-page-container">
  <div class="text-center mb-4">
    <h1 class="text-3xl font-bold m-0">Mapa de Disponibilidad</h1>
    <p class="text-secondary mt-1">
      Consulta en tiempo real los lugares libres en el estacionamiento
    </p>
  </div>

  <div class="mapa-card">
    <div
      class="visor-container"
      (wheel)="onWheel($event)"
      (mousedown)="onDragStart($event)"
      (mousemove)="onDragMove($event)"
      (mouseup)="onDragEnd()"
      (mouseleave)="onDragEnd()"
      (touchstart)="onDragStart($event)"
      (touchmove)="onDragMove($event)"
      (touchend)="onDragEnd()"
    >
      <div *ngIf="cargando" class="cargando-overlay">
        <i class="pi pi-spin pi-spinner text-3xl"></i>
      </div>

      <svg
        class="lienzo-svg"
        [style.transform]="
          'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')'
        "
        width="100%"
        height="100%"
        [attr.viewBox]="viewBoxConfig"
      >
        <g *ngFor="let el of elementosEstaticos">
          <polygon
            *ngIf="el.puntos"
            [attr.points]="el.puntos"
            [ngClass]="'estatico-' + el.tipo"
          ></polygon>

          <text
            [attr.x]="el.centro_x"
            [attr.y]="el.centro_y"
            text-anchor="middle"
            dominant-baseline="middle"
            [ngClass]="'texto-' + el.tipo"
          >
            {{ el.texto }}
          </text>
        </g>

        <g *ngFor="let cajon of cajonesGraficos">
          <polygon
            [attr.points]="cajon.puntos"
            [class]="cajon.disponible ? 'poligono-libre' : 'poligono-ocupado'"
          ></polygon>

          <text
            [attr.x]="cajon.centro_x"
            [attr.y]="cajon.centro_y"
            text-anchor="middle"
            dominant-baseline="middle"
            [class]="cajon.disponible ? 'texto-cajon libre' : 'texto-cajon ocupado'"
          >
            {{ cajon.identificador }}
          </text>
        </g>
      </svg>
    </div>

    <div class="flex flex-column align-items-center mt-4">
      <div class="flex gap-4 mb-2">
        <div class="flex align-items-center gap-2">
          <div class="cajita-leyenda libre"></div>
          <span class="text-sm font-medium">Libre</span>
        </div>
        <div class="flex align-items-center gap-2">
          <div class="cajita-leyenda ocupado"></div>
          <span class="text-sm font-medium">Ocupado</span>
        </div>
      </div>

      <span class="text-secondary text-xs mt-1">
        <i class="pi pi-search-plus mr-1"></i> Arrastra para moverte y usa la
        rueda o gestos para hacer zoom.
      </span>
    </div>
  </div>
</div>
