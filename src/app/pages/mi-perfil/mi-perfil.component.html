<div class="flex flex-column align-items-center p-4">
  <img src="icons/icon-192x192.png" alt="Logo Ecomovi" class="mb-4" style="width: 140px;" />

  <h1 class="text-3xl font-bold m-0">Mi Perfil</h1>
  <p class="text-secondary mt-1">Consulta y actualiza tus datos personales</p>

  <form [formGroup]="form" (ngSubmit)="actualizarPerfil()" class="flex flex-column gap-3 mt-4 w-full md:w-25rem">

    <div class="p-float-label">
      <input id="nombre" type="text" pInputText class="w-full" formControlName="nombre" placeholder=" " [readonly]="true" />
      <label for="nombre">Nombre(s)</label>
    </div>

    <div class="p-float-label">
      <input id="apellidoPaterno" type="text" pInputText class="w-full" formControlName="apellidoPaterno" placeholder=" " [readonly]="true" />
      <label for="apellidoPaterno">Apellido Paterno</label>
    </div>

    <div class="p-float-label">
      <input id="apellidoMaterno" type="text" pInputText class="w-full" formControlName="apellidoMaterno" placeholder=" " [readonly]="true" />
      <label for="apellidoMaterno">Apellido Materno</label>
    </div>

    <div class="p-float-label">
      <input id="correo" type="email" pInputText class="w-full" formControlName="correo" placeholder=" " />
      <label for="correo">Correo *</label>
    </div>

    <div class="p-float-label">
      <p-password
        inputId="passwordActual"
        formControlName="passwordActual"
        placeholder=" "
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-password>
      <label for="passwordActual">Contraseña Actual</label>
    </div>

    <div class="p-float-label">
      <p-password
        inputId="passwordNueva"
        formControlName="passwordNueva"
        placeholder=" "
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-password>
      <label for="passwordNueva">Nueva Contraseña</label>
    </div>

    <p-button label="Actualizar" type="submit" styleClass="w-full" [disabled]="cargando"></p-button>

  </form>
</div>
