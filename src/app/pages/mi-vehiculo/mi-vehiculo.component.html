<div class="flex flex-column align-items-center p-4">
  <img src="icons/icon-192x192.png" alt="Logo Ecomovi" class="mb-4" style="width: 140px;">

  <h1 class="text-3xl font-bold m-0">Mi Vehículo</h1>
  <p class="text-secondary mt-1">Consulta y actualiza la información de tu vehículo</p>

  <form (ngSubmit)="actualizarVehiculo()" class="flex flex-column gap-3 mt-4 w-full md:w-25rem">
    <!-- Marca -->
    <div class="p-float-label">
      <input id="marca" type="text" pInputText class="w-full" [(ngModel)]="vehiculo.marca" name="marca" placeholder=" " />
      <label for="marca">Marca</label>
    </div>

    <!-- Modelo -->
    <div class="p-float-label">
      <input id="modelo" type="text" pInputText class="w-full" [(ngModel)]="vehiculo.modelo" name="modelo" placeholder=" " />
      <label for="modelo">Modelo</label>
    </div>

    <!-- Color -->
    <div class="p-float-label">
      <input id="color" type="text" pInputText class="w-full" [(ngModel)]="vehiculo.color" name="color" placeholder=" " />
      <label for="color">Color</label>
    </div>

    <!-- Placa -->
    <div class="p-float-label">
      <input id="placa" type="text" pInputText class="w-full" [(ngModel)]="vehiculo.placa" name="placa" placeholder=" " />
      <label for="placa">Placa</label>
    </div>

    <p-button label="Actualizar" type="submit" styleClass="w-full"></p-button>
  </form>
</div>
