<div class="register-container">
  <img
    src="icons/icon-192x192.png"
    alt="Logo Ecomovi"
    class="mb-4"
    style="width: 140px"
  />

  <h1>Crear Cuenta</h1>
  <p>Regístrate para empezar a compartir tus viajes.</p>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="flex flex-column gap-3 mt-4 w-full"
  >
    <div formGroupName="perfil" class="flex flex-column gap-3">
      <div class="p-float-label">
        <input
          id="nombre"
          type="text"
          pInputText
          formControlName="nombre"
          placeholder=" "
        />
        <label for="nombre">Nombre(s) *</label>
      </div>

      <div class="p-float-label">
        <input
          id="apellido_p"
          type="text"
          pInputText
          formControlName="apellido_p"
          placeholder=" "
        />
        <label for="apellido_p">Apellido Paterno *</label>
      </div>

      <div class="p-float-label">
        <input
          id="apellido_m"
          type="text"
          pInputText
          formControlName="apellido_m"
          placeholder=" "
        />
        <label for="apellido_m">Apellido Materno *</label>
      </div>
    </div>

    <div class="p-float-label">
      <input
        id="email"
        type="email"
        pInputText
        formControlName="email"
        placeholder=" "
      />
      <label for="email">Correo Institucional *</label>
    </div>

    <div class="p-float-label">
      <p-password
        inputId="password"
        formControlName="password"
        placeholder=" "
        [feedback]="true"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        promptLabel="Introduce una contraseña"
        weakLabel="Débil"
        mediumLabel="Media"
        strongLabel="Fuerte"
      ></p-password>
      <label for="password">Contraseña *</label>
    </div>

    <div class="field-checkbox">
      <p-checkbox
        formControlName="addVehicle"
        inputId="addVehicle"
        [binary]="true"
      ></p-checkbox>
      <label for="addVehicle">Registrar un vehículo ahora</label>
    </div>

    <div *ngIf="showVehicleForm" class="flex flex-column gap-3">
      <div formGroupName="vehiculo" class="flex flex-column gap-3">
        <div class="p-float-label">
          <input
            id="placa"
            type="text"
            pInputText
            formControlName="placa"
            placeholder=" "
            maxlength="7"
          />
          <label for="placa">Placa *</label>
        </div>
        <div class="p-float-label">
          <input
            id="marca"
            type="text"
            pInputText
            formControlName="marca"
            placeholder=" "
          />
          <label for="marca">Marca *</label>
        </div>
        <div class="p-float-label">
          <input
            id="ano"
            type="number"
            pInputText
            formControlName="ano"
            placeholder=" "
            min="1900"
          />
          <label for="ano">Año *</label>
        </div>
        <div class="p-float-label">
          <input
            id="modelo"
            type="text"
            pInputText
            formControlName="modelo"
            placeholder=" "
          />
          <label for="modelo">Modelo *</label>
        </div>
        <div class="p-float-label">
          <input
            id="color"
            type="text"
            pInputText
            formControlName="color"
            placeholder=" "
          />
          <label for="color">Color *</label>
        </div>
      </div>
    </div>

    <p-button
      label="Crear Cuenta"
      type="submit"
      [loading]="form.disabled"
      styleClass="mt-2"
    ></p-button>
  </form>

  <p class="mt-4">
    ¿Ya tienes una cuenta?
    <a routerLink="/auth/login">Inicia Sesión</a>
  </p>
</div>

<p-toast></p-toast>
