<p-toast></p-toast>
<div class="flex flex-column align-items-center p-4">
  <img src="icons/icon-192x192.png" alt="Logo Ecomovi" class="mb-4" style="width: 140px;">

  <h1 class="text-3xl font-bold m-0">Mi Vehículo</h1>
  <p class="text-secondary mt-1">Consulta y actualiza la información de tu vehículo</p>

  <form [formGroup]="form" (ngSubmit)="actualizarVehiculo()" class="flex flex-column gap-3 mt-4 w-full md:w-25rem">
    
    <div class="p-float-label">
      <input id="marca" type="text" pInputText class="w-full" formControlName="marca" placeholder=" " />
      <label for="marca">Marca *</label>
    </div>

    <div class="p-float-label">
      <input id="modelo" type="text" pInputText class="w-full" formControlName="modelo" placeholder=" " />
      <label for="modelo">Modelo *</label>
    </div>

    <div class="p-float-label">
      <input
        id="ano"
        type="number"
        pInputText
        class="w-full"
        formControlName="ano"
        placeholder=" "
      />
      <label for="ano">Año *</label>
    </div>

    <div class="p-float-label">
      <input id="color" type="text" pInputText class="w-full" formControlName="color" placeholder=" " />
      <label for="color">Color *</label>
    </div>

    <div class="p-float-label">
      <input id="placa" type="text" pInputText class="w-full" formControlName="placa" placeholder=" " maxlength="7" />
      <label for="placa">Placa (sin espacios ni guiones) *</label>
    </div>

    <p-button label="Actualizar" type="submit" styleClass="w-full" [loading]="cargando"></p-button>
  
  </form>
</div>
