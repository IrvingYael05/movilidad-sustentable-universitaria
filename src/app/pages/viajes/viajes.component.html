<div class="container">
  <!-- Lista de viajes -->
  <div class="trips-list">
    <div *ngFor="let viaje of viajes" class="trip-card">
      <div class="trip-details">
        <div><strong>Nombre cualquiera</strong></div>
        <div>Calle cualquiera en cualquier lugar</div>
        <div>Hora cualquiera de cualquier día</div>
        <div>Lugares disponibles</div>
      </div>
      <button pButton label="Solicitar Unirme" class="join-button" (click)="onJoin(viaje)"></button>
    </div>
  </div>
</div>
